[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flighttrack"
version = "0.1.0"
description = "Standalone desktop air-traffic display for a Raspberry Pi touchscreen"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pygame-ce>=2.5",
    "requests>=2.31",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "shellcheck-py>=0.10",
]

[project.scripts]
flighttrack = "flighttrack.app:main"

[tool.setuptools.packages.find]
include = ["flighttrack*"]

[tool.setuptools.package-data]
flighttrack = ["feeds/data/*.json", "data/*.gz", "portal/templates/*.html", "portal/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
